spring.application.name=TutorialClase
#Pon tu puerto de MySQL, tu usuario y tu contraseña USA SI O SI ESTE NOMBRE DE BBDD
spring.datasource.url=jdbc:mysql://localhost:3307/examenInstituto?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
#CUIDADO CON EL DRIVER SI USAS MARIADB, CAMBIALO POR EL DE MARIADB, SI USAS MYSQL USA ESTE DRIVER
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 1. Estrategia DDL de Hibernate: crea el esquema limpio al arrancar y lo destruye al apagar
spring.jpa.hibernate.ddl-auto=create-drop

# 2. Forzar a Spring Boot a ejecutar los scripts SQL (schema.sql / data.sql) siempre
spring.sql.init.mode=always

# 3. CRÍTICO: Esperar a que Hibernate cree las tablas antes de lanzar data.sql
spring.jpa.defer-datasource-initialization=true

# 4. Ruta explícita del script de datos (cambiad el nombre al data.sql que tengáis en vuestro proyecto)
spring.sql.init.data-locations=classpath:data.sql